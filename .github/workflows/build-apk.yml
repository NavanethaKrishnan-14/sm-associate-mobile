name: Build Android APK

concurrency:
  group: sm-associate-android-build
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_API_BASE_URL: https://sm-associate-backend.vercel.app/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare official SM Associate app icon
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/NavanethaKrishnan-14/sm-associate-web/main/public/assets/sm-associate-logo.png \
            --output /tmp/sm-associate-logo.png
          python3 -m venv /tmp/icon-venv
          /tmp/icon-venv/bin/pip install --quiet Pillow
          /tmp/icon-venv/bin/python - <<'PY'
          from PIL import Image
          logo = Image.open("/tmp/sm-associate-logo.png").convert("RGBA")
          # The source is a wide wordmark. Keep it within Android's adaptive-icon safe zone.
          logo.thumbnail((600, 600), Image.Resampling.LANCZOS)
          x = (1024 - logo.width) // 2
          y = (1024 - logo.height) // 2

          # Standard launcher/iOS icon: white square with the full official wordmark.
          standard = Image.new("RGBA", (1024, 1024), (255, 255, 255, 255))
          standard.alpha_composite(logo, (x, y))
          standard.convert("RGB").save("assets/icon.png", format="PNG", optimize=True)

          # Android adaptive foreground: transparent outside the logo so Android's icon mask
          # cannot cover the logo with an opaque square.
          adaptive = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          adaptive.alpha_composite(logo, (x, y))
          adaptive.save("assets/adaptive-icon.png", format="PNG", optimize=True)
          print(f"Created standard and adaptive icons from official logo: {logo.size}")
          PY

      - name: Verify Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sm-associate-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
