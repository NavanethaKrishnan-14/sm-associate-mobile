name: Build Android APK

concurrency:
  group: sm-associate-android-build
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_API_BASE_URL: https://sm-associate-backend.vercel.app/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Use exact uploaded SM Associate PNG as app icon
        run: |
          test -f assets/sm-associate-exact-app-icon.png
          python3 -m venv /tmp/icon-venv
          /tmp/icon-venv/bin/pip install --quiet Pillow
          /tmp/icon-venv/bin/python - <<'PY'
          from PIL import Image
          source = Image.open("assets/sm-associate-exact-app-icon.png").convert("RGBA")
          # Use the exact uploaded artwork for the standard launcher and iOS icon.
          icon = source.resize((1024, 1024), Image.Resampling.LANCZOS)
          icon.save("assets/icon.png", format="PNG", optimize=True)
          # Keep the same exact artwork centered within Android's adaptive icon safe zone.
          foreground = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          tile = icon.resize((720, 720), Image.Resampling.LANCZOS)
          foreground.alpha_composite(tile, ((1024 - 720) // 2, (1024 - 720) // 2))
          foreground.save("assets/adaptive-icon.png", format="PNG", optimize=True)
          print("Configured uploaded exact PNG for standard and Android adaptive app icons.")
          PY

      - name: Verify Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sm-associate-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
