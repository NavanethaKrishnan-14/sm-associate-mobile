name: Build Android APK

concurrency:
  group: sm-associate-android-build
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_API_BASE_URL: https://sm-associate-backend.vercel.app/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate custom SM Associate app icons
        run: |
          python3 -m venv /tmp/icon-venv
          /tmp/icon-venv/bin/pip install --quiet CairoSVG Pillow
          /tmp/icon-venv/bin/python - <<'PY'
          import cairosvg
          from PIL import Image
          cairosvg.svg2png(url="assets/sm-associate-app-icon.svg", write_to="/tmp/sm-icon-source.png", output_width=1024, output_height=1024)
          icon = Image.open("/tmp/sm-icon-source.png").convert("RGBA")
          icon.save("assets/icon.png", format="PNG", optimize=True)
          # Adaptive foreground with transparent outer area; preserve the full tile inside Android's safe zone.
          foreground = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          tile = icon.resize((720, 720), Image.Resampling.LANCZOS)
          foreground.alpha_composite(tile, ((1024-720)//2, (1024-720)//2))
          foreground.save("assets/adaptive-icon.png", format="PNG", optimize=True)
          print("Generated custom SM Associate launcher icon and Android adaptive foreground.")
          PY

      - name: Verify Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sm-associate-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
